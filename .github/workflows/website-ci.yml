name: Website CI

on:
  push:
    branches:
      - main
      - feature/android-admob-admin-controls
  pull_request:
    branches:
      - main

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript check
        run: bun run lint
      - name: Build website
        if: always()
        run: bun run build
